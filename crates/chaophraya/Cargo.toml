[package]
name = "chaophraya"
description = "A sway-like tiling window manager for river 0.5"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chaophraya-tree = { path = "../chaophraya-tree" }
bitflags = "2"
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash", "fontconfig"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wayland-backend = "0.3"
wayland-client = "0.31"
wayland-scanner = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = { version = "0.8", default-features = false }
